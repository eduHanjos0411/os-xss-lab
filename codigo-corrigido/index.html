<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OS Manutenção — SEGURO</title>
  <!--
    ================================================================
    VERSÃO CORRIGIDA (SEGURA)
    Instituto Federal de Brasília — Segurança em Aplicações 2026/1
    Sprint 2 — Artefato XSS

    Defesas aplicadas:
      - Renderização via textContent / createElement (sem innerHTML
        em dados do usuário)
      - Função escaparHTML() quando é preciso montar markup
      - Content-Security-Policy como camada extra
      - Controle próprio com PAGINAÇÃO, desacoplado da versão
        vulnerável (storage e lógica independentes)
    ================================================================
  -->
  <!-- CAMADA EXTRA: CSP bloqueia scripts inline e de origens externas -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>🔧 OficinaTech — Ordens de Serviço</h1>
    <span class="selo selo-ok">MODO SEGURO</span>

    <form id="form-busca" class="barra-busca" autocomplete="off">
      <input type="text" id="busca" placeholder="Pesquisar por cliente, equipamento ou defeito...">
      <button type="submit">Pesquisar</button>
    </form>
    <p id="resultado-busca" class="resultado-busca"></p>
  </header>

  <main>
    <section class="painel">
      <h2>Abrir nova OS</h2>
      <form id="form-os" class="form-os" autocomplete="off">
        <input type="text" id="cliente" placeholder="Cliente" required>
        <input type="text" id="equipamento" placeholder="Equipamento" required>
        <input type="date" id="data" required>
        <input type="text" id="defeito" placeholder="Defeito relatado" required>
        <textarea id="descricao" placeholder="Descrição do serviço" rows="2" required></textarea>
        <button type="submit">Registrar OS</button>
      </form>
    </section>

    <section id="lista-os" class="grade-cards"></section>

    <!-- Controle de paginação (próprio, desacoplado) -->
    <nav id="paginacao" class="paginacao"></nav>
  </main>

  <div id="modal" class="modal oculto">
    <div class="modal-caixa">
      <button id="fechar-modal" class="fechar">×</button>
      <div id="modal-conteudo"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
